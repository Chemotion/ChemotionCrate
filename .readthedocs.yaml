# Read the Docs: https://chemotioncrate.readthedocs.io/
version: 2

build:
  os: ubuntu-26.04
  tools:
    # pyproject.toml requires >=3.14,<3.15, and autodoc imports the installed package.
    python: "3.14"

python:
  install:
    # uv with the PEP 735 `docs` dependency group: the docs build uses this project's own group
    # and uv.lock, not a second list of Sphinx pins. `uv sync` also installs the package itself,
    # which autodoc imports to read the docstrings.
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  # autodoc reports a failed import as a *warning* and carries on; without this a broken
  # dependency would publish a green build with empty API pages.
  fail_on_warning: true
