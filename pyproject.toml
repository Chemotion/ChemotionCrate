[project]
name = "chemotion-crate"
version = "402.0.0"
description = "Export a Chemotion ELN collection as an .eln RO-Crate, and read one back"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shashank S. Harivyasi" }]
keywords = ["Chemotion", "ELN", "electronic lab notebook", ".eln", "RO-Crate", "chem-dcat-ap", "FAIR", "chemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "chemotion-api==402.0.0",
    "rdflib>=7.1.3,<8",
    "linkml-runtime>=1.9.4",
    "chem-dcat-ap>=0.1.0rc4,<0.2.0",
    "dcat-ap-plus>=0.1.0rc4,<0.2.0",
    "curies>=0.10",
    "rocrate>=0.14",
    "idutils>=1.4",
    "isodate>=0.7",
    "anyascii>=0.3.3",
    "pydantic>=2,<3",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/Chemotion/ChemotionCrate"
Documentation = "https://chemotioncrate.readthedocs.io"
Source = "https://github.com/Chemotion/ChemotionCrate"
Issues = "https://github.com/Chemotion/ChemotionCrate/issues"
Changelog = "https://github.com/Chemotion/ChemotionCrate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
interactive = ["tqdm>=4.66,<5"]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "mypy>=1.10",
    "ruff>=0.14",
    "pyshacl>=0.31.0",
]
docs = [
    # autodoc imports the package, so the docs are built in the project environment (`just docs`,
    # and Read the Docs via `uv sync --group docs`).
    "sphinx>=8.2",
    "sphinx-rtd-theme>=3",
    "myst-parser>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chemotion_crate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live Chemotion instance"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
